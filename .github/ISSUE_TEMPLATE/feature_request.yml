name: Feature request
description: Propose a change in behavior or a new capability
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today. Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" and the smallest version that would work.
    validations:
      required: false
  - type: textarea
    id: cost
    attributes:
      label: Cost and dependencies
      description: New services, new dependencies, or recurring cost this implies.
    validations:
      required: false
