name: Release

# A tag is the only path to production: pushes to main do not deploy.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Attach required reviewers / deployment branch rules to this environment
    # (free for public repositories) so no tag deploys unattended.
    environment: production
    # Job-level: only this job writes, and only what it needs.
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
      id-token: write # OIDC token for cloud deploys, so no static credentials exist
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No cache in the release job: a poisoned cache would flow straight
          # into the published artifact.
          enable-cache: false
      - name: Tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [ "$tag" = "$pkg" ] || { echo "tag $tag != pyproject $pkg"; exit 1; }
      - name: Install dependencies
        run: uv sync --locked
      - name: Test with coverage gate
        run: uv run pytest --cov --cov-report=xml
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true # signed build provenance
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
